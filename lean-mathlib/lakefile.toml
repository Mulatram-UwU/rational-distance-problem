name = "lean-mathlib"
version = "0.1.0"
defaultTargets = ["RationalDistanceAlgo"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "master"

# The *core-Lean* development (no Mathlib) lives in ../lean and is reused here
# through `srcDir`, so there is exactly one copy of every source file.
# RationalDistanceAlgo.* are the Mathlib-based layers on top of it.
[[lean_lib]]
name = "RationalDistance"
srcDir = "../lean"

[[lean_lib]]
name = "RationalDistanceAlgo"
